[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desicrew-assessment"
version = "0.1.0"
description = "Local inventory code agent, cited support assistant, and document-review pipeline"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["desicrew*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
